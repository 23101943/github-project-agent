name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install httpx
      - name: Run unit tests (all mocked, no token needed)
        run: python -m unittest -v test_github_client test_github_tools
